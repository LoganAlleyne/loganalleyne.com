<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- Social preview image (1200×630). Rebuild with `npm run og:image`. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Raleway:wght@800&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #07080d; color: #e8ecf7; font-family: 'Source Sans 3', sans-serif; }
  body { box-sizing: border-box; padding: 70px 80px; display: flex; flex-direction: column; justify-content: center;
         background-image: linear-gradient(rgba(16,181,239,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(16,181,239,.05) 1px, transparent 1px);
         background-size: 40px 40px; }
  .p { font-family: 'JetBrains Mono', monospace; color: #10b5ef; font-size: 30px; }
  h1 { font-family: Raleway, sans-serif; font-weight: 800; font-size: 120px; letter-spacing: -2px; margin: 10px 0 18px; line-height: 1; }
  h1 span { background: linear-gradient(90deg, #7b7fe8, #1a6fd1 45%, #10b5ef); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .r { font-size: 44px; }
  .t { font-size: 34px; color: #c9d1e4; margin-top: 6px; }
  .s { font-family: 'JetBrains Mono', monospace; color: #9aa3c0; font-size: 26px; margin-top: 40px; }
</style>
</head>
<body>
  <div class="p">~ $ whoami</div>
  <h1>Logan <span>Alleyne</span></h1>
  <div class="r">Full-stack software engineer</div>
  <div class="t">PHP / Laravel · Python · Vue / TypeScript</div>
  <div class="s">loganalleyne.com · London or remote</div>
</body>
</html>
