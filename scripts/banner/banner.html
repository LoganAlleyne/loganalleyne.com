<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- LinkedIn banner (1584×396). Rebuild with `npm run banner`. The left third stays quiet because the profile photo covers it. -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Raleway:wght@800&family=Source+Sans+3:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; }
  body { box-sizing: border-box; background: #07080d; color: #e8ecf7; font-family: 'Source Sans 3', sans-serif;
         background-image:
           radial-gradient(ellipse 60% 120% at 85% 50%, rgba(26,111,209,.22), transparent 70%),
           linear-gradient(rgba(16,181,239,.05) 1px, transparent 1px),
           linear-gradient(90deg, rgba(16,181,239,.05) 1px, transparent 1px);
         background-size: auto, 36px 36px, 36px 36px;
         display: flex; align-items: center; justify-content: flex-end; padding: 0 88px; }
  .panel { width: 860px; background: #0e1019; border: 1px solid #1d2135; border-radius: 14px; padding: 26px 36px 30px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .dots { display: flex; gap: 9px; margin-bottom: 18px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #1d2135; }
  .p { font-family: 'JetBrains Mono', monospace; color: #10b5ef; font-size: 20px; }
  h1 { font-family: Raleway, sans-serif; font-weight: 800; font-size: 74px; letter-spacing: -1.5px; line-height: 1; margin: 8px 0 14px; }
  h1 span { background: linear-gradient(90deg, #7b7fe8, #1a6fd1 45%, #10b5ef); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .r { font-size: 28px; }
  .s { font-family: 'JetBrains Mono', monospace; color: #9aa3c0; font-size: 18px; margin-top: 16px; }
  .s b { color: #10b5ef; font-weight: 400; }
  .cursor { display: inline-block; width: .55em; height: 1em; background: #10b5ef; vertical-align: -.15em; margin-left: 4px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="p">~ $ whoami</div>
    <h1>Logan <span>Alleyne</span></h1>
    <div class="r">Full-stack software engineer: PHP / Laravel · Python · Vue / TypeScript</div>
    <div class="s"><b>~ $</b> open loganalleyne.com<span class="cursor"></span></div>
  </div>
</body>
</html>
